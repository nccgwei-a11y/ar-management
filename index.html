<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>越南協發有限公司财务管理</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<meta name="theme-color" content="#f3f6fb">
<script src="lib/xlsx.full.min.js"></script>
<style>
:root{
  --blue:#2563eb; --blue-d:#1d4ed8; --blue-soft:#eef4ff;
  --bg:#f3f6fb; --card:#fff; --line:#e5eaf2; --line-soft:#eef1f7;
  --txt:#17233a; --sub:#64748b; --sub-2:#94a3b8;
  --green:#059669; --red:#dc2626; --amber:#d97706; --purple:#7c3aed;
  --shadow:0 1px 3px rgba(16,32,60,.08),0 4px 14px rgba(16,32,60,.06);
  --shadow-sm:0 1px 2px rgba(16,32,60,.07);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:"Microsoft YaHei","Segoe UI",sans-serif;background:var(--bg);color:var(--txt);font-size:14px;-webkit-tap-highlight-color:transparent}
button,input,select{font-family:inherit}
.app{position:fixed;inset:0;display:flex}
.main{height:100vh;display:flex;flex:1;min-width:0;flex-direction:column}
.content{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;scrollbar-gutter:stable;padding:22px 24px}
.content::-webkit-scrollbar{width:12px;height:12px}
.content::-webkit-scrollbar-track{background:transparent}
.content::-webkit-scrollbar-thumb{background:#c3cede;border:3px solid var(--bg);border-radius:8px}
.content::-webkit-scrollbar-thumb:hover{background:#93a4bd}

/* ===== 侧边栏（浅色商务） ===== */
.side{width:218px;background:var(--card);border-right:1px solid var(--line);color:var(--txt);flex-shrink:0;display:flex;flex-direction:column}
.side .logo{padding:20px 18px 14px;border-bottom:1px solid var(--line-soft)}
.side .logo img{width:116px;height:auto;display:block;background:#fff;border:1px solid var(--line-soft);border-radius:10px;padding:8px;box-sizing:border-box}
.side .logo small{display:block;font-size:11.5px;color:var(--sub);margin-top:10px;line-height:1.5}
.nav{padding:12px 12px;flex:1;overflow-y:auto}
.nav button{width:100%;display:flex;align-items:center;gap:10px;padding:11px 14px;border:0;background:transparent;color:var(--sub);border-radius:10px;cursor:pointer;font-size:14px;margin-bottom:6px;text-align:left;transition:background .15s,color .15s;min-height:42px}
.nav button:hover{background:var(--line-soft);color:var(--txt)}
.nav button.active{background:var(--blue-soft);color:var(--blue-d);font-weight:600}
.side .foot{padding:14px 18px;font-size:11px;color:var(--sub-2);border-top:1px solid var(--line-soft)}
.side .foot .acc{display:block;margin-top:4px;color:var(--sub);font-size:11.5px;word-break:break-all}

/* ===== 顶栏 ===== */
.topbar{background:var(--card);border-bottom:1px solid var(--line);padding:13px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:var(--shadow-sm)}
.topbar h2{font-size:16px;font-weight:700;letter-spacing:.2px}
.spacer{flex:1}
.filter-box{display:flex;align-items:center;gap:8px;color:var(--sub);font-size:13px;flex-wrap:wrap}
.filter-box input,.filter-box select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;background:#fff;color:var(--txt);min-height:38px}
.filter-box input[type=month]{min-width:132px}
.filter-box .search{padding:8px 12px;border:1px solid var(--line);border-radius:8px;width:230px;max-width:100%;min-height:38px}
.filter-box .search:focus,.filter-box input:focus,.filter-box select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.12)}

/* ===== 同步状态徽章 ===== */
.sync{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:20px;background:#f1f5f9;font-size:12.5px;color:var(--sub);white-space:nowrap}
.sync .dot{width:8px;height:8px;border-radius:50%;background:#94a3b8;flex-shrink:0}
.sync .sync-time{opacity:.75;font-size:11px}
.sync.online{background:#ecfdf5;color:#047857}
.sync.online .dot{background:#10b981}
.sync.syncing{background:#eff6ff;color:#1d4ed8}
.sync.syncing .dot{background:#3b82f6;animation:pulse 1.2s ease-in-out infinite}
.sync.offline{background:#f1f5f9;color:#64748b}
.sync.offline .dot{background:#94a3b8}
.sync.error{background:#fef2f2;color:#dc2626}
.sync.error .dot{background:#ef4444}
.sync.loading{background:#eff6ff;color:#1d4ed8}
.sync.loading .dot{background:#3b82f6;animation:pulse 1.2s ease-in-out infinite}
.sync.signedout{background:#f1f5f9;color:var(--sub)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ===== 按钮 ===== */
.btn{padding:8px 15px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;font-size:13.5px;color:var(--txt);min-height:38px;transition:border-color .15s,background .15s,color .15s}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-d);color:#fff}
.btn.danger{color:var(--red);border-color:#f3c2c2}
.btn.danger:hover{background:#fef2f2;border-color:var(--red)}
.btn.sm{padding:6px 11px;font-size:12.5px;min-height:32px;border-radius:7px}
th.sortable{cursor:pointer;user-select:none;white-space:nowrap}
th.sortable:hover{color:var(--blue)}

/* ===== 卡片与面板 ===== */
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-bottom:20px}
.profit-cards{grid-template-columns:repeat(3,1fr)}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow-sm)}
.kpi .label{color:var(--sub);font-size:13px;margin-bottom:10px}
.kpi .num{font-size:24px;font-weight:700;word-break:break-all}
.kpi .num.red{color:var(--red)} .kpi .num.green{color:var(--green)} .kpi .num.blue{color:var(--blue)} .kpi .num.purple{color:var(--purple)}
.kpi .hint{font-size:12px;color:var(--sub);margin-top:8px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:20px;overflow:visible;box-shadow:var(--shadow-sm)}
.content .panel{width:max-content;min-width:100%}
.content table{width:max-content;min-width:100%}
.panel .ph{padding:15px 20px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel .ph h3{font-size:15px;font-weight:700}
.panel .pb{padding:18px 20px}
.tbl-scroll{overflow-x:auto;overflow-y:visible;-webkit-overflow-scrolling:touch}
/* 冻结右侧列：横向滚动发生在 .content 上，所以带 .sr 的表格容器不能自己成为滚动容器 */
.content .tbl-scroll.sr{overflow:visible}
.sr th.sr-col,.sr td.sr-col{position:sticky;z-index:2;background:#fff}
.sr th.sr-col{background:#f7f9fc;z-index:3}
.sr .sr-act{right:0;box-shadow:inset 1px 0 0 var(--line)}
.sr .sr-mark{right:0;width:140px;min-width:140px;max-width:140px}
.sr .sr-stat{right:140px;box-shadow:inset 1px 0 0 var(--line)}
.sr tbody tr:hover td.sr-col{background:#f8faff}
.sr tr.mark-red td.sr-col{background:#fef2f2}.sr tr.mark-yellow td.sr-col{background:#fffbe6}.sr tr.mark-blue td.sr-col{background:#eff6ff}.sr tr.mark-green td.sr-col{background:#ecfdf5}
.sr tr.mark-red:hover td.sr-col{background:#fee2e2}.sr tr.mark-yellow:hover td.sr-col{background:#fff3c4}.sr tr.mark-blue:hover td.sr-col{background:#dbeafe}.sr tr.mark-green:hover td.sr-col{background:#d1fae5}
.sr tr.total-row td.sr-col{background:#f7f9fc}

/* ===== 客户下拉建议 ===== */
.man-cust-wrap{position:relative;min-width:180px}
.man-cust-list{display:none;position:fixed;min-width:240px;max-height:260px;overflow-y:auto;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(16,32,60,.16);z-index:300}
.man-cust-list.open{display:block}
.man-cust-item{padding:8px 10px;cursor:pointer;font-size:12.5px;border-bottom:1px solid var(--line-soft)}
.man-cust-item:last-child{border-bottom:none}
.man-cust-item:hover{background:#f4f7ff}
.man-cust-item .ci-code{color:var(--sub);font-size:11px;margin-bottom:2px}
.man-cust-item .ci-name{font-weight:600}
.man-cust-empty{padding:8px 10px;color:var(--sub);font-size:12px}

/* ===== 表格 ===== */
table{width:100%;border-collapse:collapse}
th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line-soft);font-size:13px;white-space:nowrap}
th{color:var(--sub);font-weight:600;background:#f7f9fc}
tbody tr:hover{background:#f8faff}
tr.yellow-row{background:#fffbe6}
tr.yellow-row:hover{background:#fff6cc}
tr.sheet-pick.active{background:var(--blue-soft)}
tr.sheet-pick.active td{font-weight:600}
tr.cash-row{background:#fffbeb}
tr.cash-row:hover{background:#fff4d6}
.mark-dot{display:inline-block;width:16px;height:16px;border-radius:50%;margin-right:5px;cursor:pointer;border:1px solid rgba(0,0,0,.18);vertical-align:middle}
.mark-dot.red{background:#ef4444}.mark-dot.yellow{background:#facc15}.mark-dot.blue{background:#3b82f6}.mark-dot.green{background:#22c55e}
.mark-dot.sel{outline:2px solid #111827;outline-offset:1px}
.mark-clear{cursor:pointer;color:var(--sub);font-size:13px;margin-left:2px}
tr.mark-red{background:#fef2f2}tr.mark-yellow{background:#fffbe6}tr.mark-blue{background:#eff6ff}tr.mark-green{background:#ecfdf5}
tr.mark-red:hover{background:#fee2e2}tr.mark-yellow:hover{background:#fff3c4}tr.mark-blue:hover{background:#dbeafe}tr.mark-green:hover{background:#d1fae5}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.name{white-space:normal;min-width:200px}
.muted{color:var(--sub)}
.amber{color:var(--amber)}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600}
.tag.unpaid{background:#fef2f2;color:var(--red)}
.tag.paid{background:#ecfdf5;color:var(--green)}
.tag.part{background:#fffbeb;color:var(--amber)}
.tag.usd{background:#f5f3ff;color:var(--purple)}
.drop{border:2px dashed #c3cede;border-radius:16px;padding:54px 20px;text-align:center;background:#fbfcfe;cursor:pointer}
.drop:hover,.drop.over{border-color:var(--blue);background:#f5f8ff}
.drop .big{font-size:40px;margin-bottom:10px}
.drop p{color:var(--sub);margin-top:6px}
.wizard{display:none}
.row2{display:flex;gap:14px;flex-wrap:wrap;align-items:end;margin-bottom:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--sub)}
.field select,.field input{padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;min-width:150px;background:#fff}
.preview-wrap{max-height:380px;overflow:auto;border:1px solid var(--line);border-radius:10px;-webkit-overflow-scrolling:touch}
.preview-wrap table{font-size:12px}
.preview-wrap th,.preview-wrap td{padding:7px 9px}
tr.ignored{background:#fafafa;color:#9ca3af}
tr.ignored td{text-decoration:line-through}
.note-line{background:#f0f6ff;border:1px solid #d4e3ff;color:#1e4fa8;padding:10px 14px;border-radius:10px;margin-bottom:14px;font-size:13px}
.warn-line{background:#fffbeb;border:1px solid #fde68a;color:#92610a;padding:10px 14px;border-radius:10px;margin-bottom:14px;font-size:13px}
.modal-mask{display:none;position:fixed;inset:0;background:rgba(15,27,51,.45);z-index:50;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:16px;width:460px;max-width:100%;padding:22px 24px;max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(16,32,60,.25)}
.modal h4{font-size:16px;margin-bottom:16px}
.modal .mline{display:flex;justify-content:space-between;gap:12px;padding:8px 0;font-size:13px;border-bottom:1px solid var(--line-soft)}
.modal .mline span:first-child{color:var(--sub)}
.modal input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;margin:14px 0;font-size:15px}
.modal .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:10px;flex-wrap:wrap}
tr.detail-row td{background:#fafbfe;padding:0}
.detail-inner{padding:10px 16px}
.caret{display:inline-block;transition:.2s;cursor:pointer;width:16px;color:var(--sub)}
tr.open .caret{transform:rotate(90deg)}
.empty{text-align:center;padding:50px 20px;color:var(--sub)}
.empty .e1{font-size:38px;margin-bottom:10px}
.flex{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.gap{gap:14px}
.mt{margin-top:14px}
.total-row td{font-weight:700;background:#f7f9fc}
.result-count{font-size:12.5px;color:var(--sub)}

/* ===== 手机适配 ===== */
@media(max-width:900px){
  .app{flex-direction:column}
  .side{width:100%;border-right:0;border-bottom:1px solid var(--line)}
  .side .logo{padding:12px 16px 10px;display:flex;align-items:center;gap:12px}
  .side .logo img{width:72px;padding:5px}
  .side .logo small{margin-top:0}
  .nav{display:flex;overflow-x:auto;padding:6px 10px;gap:6px;flex:0 1 0;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav button{width:auto;flex-shrink:0;margin:0;padding:9px 13px;font-size:13px;min-height:38px}
  .side .foot{display:none}
  .topbar{padding:10px 14px;gap:8px}
  .topbar h2{font-size:15px}
  .content{padding:14px 12px}
  .cards{grid-template-columns:repeat(2,1fr);gap:10px}
  .profit-cards{grid-template-columns:1fr}
  .kpi{padding:14px 15px}
  .kpi .num{font-size:19px}
  .panel .pb{padding:12px}
  .filter-box{width:100%}
  .filter-box .search{width:100%}
  .filter-box input[type=month]{flex:1;min-width:110px}
  .btn{padding:9px 14px}
  .field select,.field input{min-width:0;width:100%}
  .modal{padding:18px 16px;border-radius:14px}
  th,td{padding:9px 10px;font-size:12.5px}
}
@media(max-width:480px){
  .cards{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app" style="display:flex">
  <aside class="side">
    <div class="logo">
      <img src="icons/logo-sidebar.png" alt="Hiệp Phát">
      <small>越南協發有限公司<br>财务管理 · 三端实时同步</small>
    </div>
    <nav class="nav">
      <button data-view="dashboard" class="active">📊 总览</button>
      <button data-view="customers">🏢 客户</button>
      <button data-view="receipts">💵 收款</button>
      <button data-view="expenses">💰 支出/利润</button>
      <button data-view="import">📥 导入</button>
      <button data-view="data">⚙️ 管理</button>
    </nav>
    <div class="foot">v5.4 · 云端实时同步 · 离线可用<span class="acc" id="sideAccount"></span></div>
  </aside>
  <div class="main">
    <div class="topbar">
      <h2 id="viewTitle">总览看板</h2>
      <span id="syncChip" class="sync loading" title="云端同步状态">
        <i class="dot" id="syncDot"></i><span id="syncText">连接中</span><span class="sync-time" id="syncTime"></span>
      </span>
      <div class="spacer"></div>
      <div class="filter-box">
        <input class="search" id="globalSearch" placeholder="搜索客户 / 代码 / 发票号 / 地址">
        <select id="statusFilter" title="收款状态">
          <option value="all">全部状态</option>
          <option value="unpaid">未收</option>
          <option value="partial">部分收款</option>
          <option value="paid">已清款</option>
          <option value="cash">现金收入</option>
        </select>
        <select id="currencyFilter" title="币种">
          <option value="all">全部币种</option>
          <option value="VND">VND</option>
          <option value="USD">USD</option>
        </select>
        <input type="month" id="startMonth" title="开始月份">
        <span>至</span>
        <input type="month" id="endMonth" title="结束月份">
        <button class="btn sm" id="resetFilter">全部</button>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>
<div class="modal-mask" id="modalMask"><div class="modal" id="modalBox"></div></div>
<div class="modal-mask" id="loginMask" style="display:flex">
  <div class="modal" style="max-width:380px">
    <img src="icons/logo-login.png" alt="Hiệp Phát" style="width:130px;display:block;margin:0 auto 10px">
    <h3 style="margin:0 0 4px;text-align:center">越南協發有限公司财务管理</h3>
    <div class="muted" style="font-size:12.5px;margin-bottom:14px;text-align:center">登录后数据实时同步，登录状态自动保留</div>
    <label style="font-size:12.5px">账号</label>
    <input id="loginEmail" type="email" value="admin@hiepphat.local" style="width:100%;margin:4px 0 10px;padding:9px">
    <label style="font-size:12.5px">密码</label>
    <input id="loginPassword" type="password" placeholder="请输入密码" style="width:100%;margin:4px 0 8px;padding:9px">
    <div id="loginErr" style="color:#dc2626;font-size:12.5px;min-height:16px"></div>
    <button class="btn primary" style="width:100%;justify-content:center" onclick="doLogin()">登录</button>
  </div>
</div>
<script src="lib/firebase/firebase-app-compat.js"></script>
<script src="lib/firebase/firebase-auth-compat.js"></script>
<script src="lib/firebase/firebase-firestore-compat.js"></script>
<script src="cloud.js"></script>
<script src="app.js"></script>
<script>
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
