<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>越南協發有限公司财务管理</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<meta name="theme-color" content="#0f1b33">
<script src="lib/xlsx.full.min.js"></script>
<style>
:root{
  --blue:#2563eb; --blue-d:#1d4ed8; --bg:#f4f6fa; --card:#fff; --line:#e5e8ef;
  --txt:#1f2937; --sub:#6b7280; --green:#059669; --red:#dc2626; --amber:#d97706; --purple:#7c3aed;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:"Microsoft YaHei","Segoe UI",sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
.app{position:fixed;inset:0;display:flex}
/* 固定滑块：主区域内部滚动，滚动条始终贴边显示 */
.main{height:100vh}
.content{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;scrollbar-gutter:stable}
.content::-webkit-scrollbar{width:14px;height:14px}
.content::-webkit-scrollbar-track{background:#e9edf3}
.content::-webkit-scrollbar-thumb{background:#9aa7bb;border:3px solid #e9edf3;border-radius:8px}
.content::-webkit-scrollbar-thumb:hover{background:#728099}
.content::-webkit-scrollbar-corner{background:#e9edf3}
.side{width:200px;background:#0f1b33;color:#cbd5e1;flex-shrink:0;display:flex;flex-direction:column}
.side .logo{padding:22px 20px;font-size:17px;font-weight:700;color:#fff;letter-spacing:.5px}
.side .logo img{width:108px;height:auto;display:block;background:#fff;border-radius:8px;padding:8px;box-sizing:border-box}
.side .logo small{display:block;font-size:11px;font-weight:400;color:#7d8aa3;margin-top:8px}
.nav{padding:8px 12px;flex:1}
.nav button{width:100%;display:flex;align-items:center;gap:10px;padding:11px 14px;border:0;background:transparent;color:#9fb0c8;border-radius:8px;cursor:pointer;font-size:14px;margin-bottom:4px;text-align:left}
.nav button:hover{background:#1b2c4d;color:#fff}
.nav button.active{background:var(--blue);color:#fff}
.side .foot{padding:14px 20px;font-size:11px;color:#5b6b85}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{background:var(--card);border-bottom:1px solid var(--line);padding:14px 26px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.topbar h2{font-size:16px;font-weight:700}
.spacer{flex:1}
.filter-box{display:flex;align-items:center;gap:8px;color:var(--sub);font-size:13px;flex-wrap:wrap}
.filter-box input[type=month]{padding:6px 10px;border:1px solid var(--line);border-radius:7px;font-size:13px}
.btn{padding:8px 16px;border:1px solid var(--line);background:#fff;border-radius:7px;cursor:pointer;font-size:13px;color:var(--txt)}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-d)}
.btn.danger{color:var(--red);border-color:#f3c2c2}
.btn.danger:hover{background:#fef2f2}
th.sortable{cursor:pointer;user-select:none;white-space:nowrap}
th.sortable:hover{color:var(--blue)}
.btn.sm{padding:6px 11px;font-size:12px}
.content{padding:24px 26px;flex:1}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.kpi .label{color:var(--sub);font-size:13px;margin-bottom:10px}
.kpi .num{font-size:24px;font-weight:700;word-break:break-all}
.kpi .num.red{color:var(--red)} .kpi .num.green{color:var(--green)} .kpi .num.blue{color:var(--blue)} .kpi .num.purple{color:var(--purple)}
.kpi .hint{font-size:12px;color:var(--sub);margin-top:8px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:20px;overflow:visible}
.content .panel{width:max-content;min-width:100%}
.content table{width:max-content;min-width:100%}
.panel .ph{padding:15px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel .ph h3{font-size:15px;font-weight:700}
.panel .pb{padding:18px 20px}
.tbl-scroll{overflow:visible}
.man-cust-wrap{position:relative;min-width:180px}
.man-cust-list{display:none;position:fixed;min-width:240px;max-height:260px;overflow-y:auto;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:300}
.man-cust-list.open{display:block}
.man-cust-item{padding:8px 10px;cursor:pointer;font-size:12.5px;border-bottom:1px solid #f0f2f5}
.man-cust-item:last-child{border-bottom:none}
.man-cust-item:hover{background:#f4f7ff}
.man-cust-item .ci-code{color:var(--sub);font-size:11px;margin-bottom:2px}
.man-cust-item .ci-name{font-weight:600}
.man-cust-empty{padding:8px 10px;color:var(--sub);font-size:12px}
table{width:100%;border-collapse:collapse}
th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:13px;white-space:nowrap}
th{color:var(--sub);font-weight:600;background:#fafbfd}
tbody tr:hover{background:#f8faff}
tr.yellow-row{background:#fffbe6}
tr.yellow-row:hover{background:#fff6cc}
tr.sheet-pick.active{background:#eef4ff}
tr.sheet-pick.active td{font-weight:600}
tr.cash-row{background:#fffbeb}
tr.cash-row:hover{background:#fff4d6}
.mark-dot{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:5px;cursor:pointer;border:1px solid rgba(0,0,0,.18);vertical-align:middle}
.mark-dot.red{background:#ef4444}.mark-dot.yellow{background:#facc15}.mark-dot.blue{background:#3b82f6}.mark-dot.green{background:#22c55e}
.mark-dot.sel{outline:2px solid #111827;outline-offset:1px}
.mark-clear{cursor:pointer;color:var(--sub);font-size:13px;margin-left:2px}
tr.mark-red{background:#fef2f2}tr.mark-yellow{background:#fffbe6}tr.mark-blue{background:#eff6ff}tr.mark-green{background:#ecfdf5}
tr.mark-red:hover{background:#fee2e2}tr.mark-yellow:hover{background:#fff3c4}tr.mark-blue:hover{background:#dbeafe}tr.mark-green:hover{background:#d1fae5}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.name{white-space:normal;min-width:200px}
.muted{color:var(--sub)}
.amber{color:var(--amber)}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600}
.tag.unpaid{background:#fef2f2;color:var(--red)}
.tag.paid{background:#ecfdf5;color:var(--green)}
.tag.part{background:#fffbeb;color:var(--amber)}
.tag.usd{background:#f5f3ff;color:var(--purple)}
.drop{border:2px dashed #b9c6dd;border-radius:14px;padding:54px 20px;text-align:center;background:#fbfcfe;cursor:pointer}
.drop:hover,.drop.over{border-color:var(--blue);background:#f5f8ff}
.drop .big{font-size:40px;margin-bottom:10px}
.drop p{color:var(--sub);margin-top:6px}
.wizard{display:none}
.row2{display:flex;gap:14px;flex-wrap:wrap;align-items:end;margin-bottom:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--sub)}
.field select,.field input{padding:8px 10px;border:1px solid var(--line);border-radius:7px;font-size:13px;min-width:150px}
.preview-wrap{max-height:380px;overflow:auto;border:1px solid var(--line);border-radius:8px;-webkit-overflow-scrolling:touch}
.preview-wrap table{font-size:12px}
.preview-wrap th,.preview-wrap td{padding:7px 9px}
tr.ignored{background:#fafafa;color:#9ca3af}
tr.ignored td{text-decoration:line-through}
.note-line{background:#f0f6ff;border:1px solid #d4e3ff;color:#1e4fa8;padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:13px}
.warn-line{background:#fffbeb;border:1px solid #fde68a;color:#92610a;padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:13px}
.modal-mask{display:none;position:fixed;inset:0;background:rgba(15,27,51,.45);z-index:50;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:14px;width:440px;max-width:100%;padding:22px 24px;max-height:92vh;overflow:auto}
.modal h4{font-size:16px;margin-bottom:16px}
.modal .mline{display:flex;justify-content:space-between;gap:12px;padding:8px 0;font-size:13px;border-bottom:1px solid var(--line)}
.modal .mline span:first-child{color:var(--sub)}
.modal input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin:14px 0;font-size:15px}
.modal .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:10px;flex-wrap:wrap}
tr.detail-row td{background:#fafbfe;padding:0}
.detail-inner{padding:10px 16px}
.caret{display:inline-block;transition:.2s;cursor:pointer;width:16px;color:var(--sub)}
tr.open .caret{transform:rotate(90deg)}
.search{padding:8px 12px;border:1px solid var(--line);border-radius:8px;width:240px;max-width:100%}
.empty{text-align:center;padding:50px 20px;color:var(--sub)}
.empty .e1{font-size:38px;margin-bottom:10px}
.flex{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.gap{gap:14px}
.mt{margin-top:14px}
.total-row td{font-weight:700;background:#fafbfd}
@media(max-width:820px){
  .app{flex-direction:column}
  .side{width:100%}
  .side .logo{padding:14px 18px}
  .nav{display:flex;overflow-x:auto;padding:6px 10px;gap:6px}
  .nav button{width:auto;flex-shrink:0;margin:0;padding:9px 13px;font-size:13px}
  .side .foot{padding:8px 16px}
  .topbar{padding:12px 16px}
  .content{padding:16px 14px}
  .cards{grid-template-columns:1fr;gap:12px}
  .kpi .num{font-size:22px}
  .panel .pb{padding:14px}
  .search{width:100%}
  .btn{padding:9px 14px}
  .field select,.field input{min-width:0}
}
</style>
</head>
<body>
<div class="app" style="display:flex">
  <aside class="side">
    <div class="logo"><img src="icons/logo-sidebar.png" alt="Hiệp Phát"><small>越南協發有限公司财务管理 · 三端实时同步</small></div>
    <nav class="nav">
      <button data-view="dashboard" class="active">📊 总览</button>
      <button data-view="customers">🏢 客户</button>
      <button data-view="import">📥 导入</button>
      <button data-view="data">⚙️ 管理</button>
    </nav>
    <div class="foot">v4.0 · 云端实时同步 · 离线可用</div>
  </aside>
  <div class="main">
    <div class="topbar">
      <h2 id="viewTitle">总览看板</h2>
      <div class="spacer"></div>
      <div class="filter-box">
        月份
        <input type="month" id="startMonth">
        <span>至</span>
        <input type="month" id="endMonth">
        <button class="btn sm" id="resetFilter">全部</button>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>
<div class="modal-mask" id="modalMask"><div class="modal" id="modalBox"></div></div>
<div class="modal-mask" id="loginMask" style="display:flex">
  <div class="modal" style="max-width:380px">
    <img src="icons/logo-login.png" alt="Hiệp Phát" style="width:130px;display:block;margin:0 auto 10px">
    <h3 style="margin:0 0 4px;text-align:center">越南協發有限公司财务管理</h3>
    <div class="muted" style="font-size:12.5px;margin-bottom:14px;text-align:center">登录后数据实时同步，登录状态自动保留</div>
    <label style="font-size:12.5px">账号</label>
    <input id="loginEmail" type="email" value="admin@hiepphat.local" style="width:100%;margin:4px 0 10px;padding:9px">
    <label style="font-size:12.5px">密码</label>
    <input id="loginPassword" type="password" placeholder="请输入密码" style="width:100%;margin:4px 0 8px;padding:9px">
    <div id="loginErr" style="color:#dc2626;font-size:12.5px;min-height:16px"></div>
    <button class="btn primary" style="width:100%;justify-content:center" onclick="doLogin()">登录</button>
  </div>
</div>
<script src="lib/firebase/firebase-app-compat.js"></script>
<script src="lib/firebase/firebase-auth-compat.js"></script>
<script src="lib/firebase/firebase-firestore-compat.js"></script>
<script src="cloud.js"></script>
<script src="app.js"></script>
<script>
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
