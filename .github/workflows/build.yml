name: 打包发布

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: 电脑版-exe
          path: release/*.exe
      - name: 发布到 Releases（打 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: npm install
      - run: npm run prepare:www
      - run: npx cap add android
      - run: npx cap sync android
      - name: 替换安卓原生启动图标为公司 LOGO
        run: |
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-*
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            density=${pair%%:*}; size=${pair##*:}
            mkdir -p $RES/mipmap-$density
            cp android-assets/ic_$size.png $RES/mipmap-$density/ic_launcher.png
            cp android-assets/ic_$size.png $RES/mipmap-$density/ic_launcher_round.png
          done
      - run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk 越南協發有限公司财务管理-手机版.apk
      - uses: actions/upload-artifact@v4
        with:
          name: 手机版-apk
          path: 越南協發有限公司财务管理-手机版.apk
      - name: 发布到 Releases（打 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: 越南協發有限公司财务管理-手机版.apk

  deploy-pages:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
